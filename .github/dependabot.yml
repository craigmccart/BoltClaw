# Dependabot configuration.
#
# Bumps npm and GitHub Actions dependencies weekly. Security advisories
# trigger updates regardless of the schedule.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major version bumps get reviewed by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      # init and analyze must move together or CodeQL refuses to run.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
